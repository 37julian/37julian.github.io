name: Garmin Aktivitäten abrufen

on:
  schedule:
    - cron: "0 6 * * *" # täglich um 06:00 UTC
  workflow_dispatch: # manuell auslösbar

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r scripts/requirements.txt

      - name: Garmin-Daten abrufen
        env:
          GARMIN_TOKEN_BASE64: ${{ secrets.GARMIN_TOKEN_BASE64 }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/fetch_garmin.py

      - name: Änderungen committen und pushen
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/activities.json
          if git diff --staged --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "chore: Garmin-Aktivitäten aktualisiert [skip ci]"
            git push
          fi
