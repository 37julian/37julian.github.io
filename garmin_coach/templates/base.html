<!DOCTYPE html>
<html lang="de" class="h-full bg-gray-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Garmin Coach{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        garmin: { DEFAULT: '#00B0F0', dark: '#0088CC' }
      }
    }
  }
}
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .nav-link { @apply flex items-center gap-2 px-3 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors text-sm font-medium; }
  .nav-link.active { @apply text-garmin bg-garmin/10; }
  .card { @apply bg-gray-900 rounded-xl p-5 border border-gray-800; }
  .stat-card { @apply bg-gray-900 rounded-xl p-4 border border-gray-800; }
  .badge { @apply inline-flex items-center px-2 py-0.5 rounded text-xs font-medium; }
</style>
</head>
<body class="dark h-full text-gray-100">

<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col flex-shrink-0">
    <div class="p-4 border-b border-gray-800">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-garmin rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg>
        </div>
        <span class="text-white font-semibold text-sm">Garmin Coach</span>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/activities" class="nav-link {% if '/activities' in request.url.path %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Aktivitäten
      </a>
      <a href="/sleep" class="nav-link {% if '/sleep' in request.url.path %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        Schlaf
      </a>
      <a href="/health" class="nav-link {% if '/health' in request.url.path %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        Gesundheit
      </a>
      <a href="/chat" class="nav-link {% if '/chat' in request.url.path %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
        AI Coach
      </a>
    </nav>
    <div class="p-3 border-t border-gray-800">
      <button
        hx-post="/api/sync"
        hx-swap="none"
        onclick="startSync()"
        id="sync-btn"
        class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-garmin hover:bg-garmin-dark rounded-lg text-white text-xs font-medium transition-colors">
        <svg id="sync-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Sync
      </button>
      <div id="sync-status" class="mt-1 text-xs text-gray-500 text-center hidden"></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto bg-gray-950">
    {% block content %}{% endblock %}
  </main>
</div>

<script>
function startSync() {
  const btn = document.getElementById('sync-btn');
  const status = document.getElementById('sync-status');
  const icon = document.getElementById('sync-icon');
  btn.disabled = true;
  icon.classList.add('animate-spin');
  status.classList.remove('hidden');
  status.textContent = 'Sync läuft...';

  const es = new EventSource('/api/sync');
  es.onmessage = (e) => {
    status.textContent = e.data;
    if (e.data.startsWith('Fertig') || e.data.startsWith('FEHLER')) {
      es.close();
      btn.disabled = false;
      icon.classList.remove('animate-spin');
      setTimeout(() => location.reload(), 1500);
    }
  };
  es.onerror = () => {
    es.close();
    btn.disabled = false;
    icon.classList.remove('animate-spin');
    status.textContent = 'Verbindungsfehler';
  };
}

// Charts: global defaults
Chart.defaults.color = '#9CA3AF';
Chart.defaults.borderColor = '#1F2937';
Chart.defaults.font.size = 11;
</script>

{% block scripts %}{% endblock %}
</body>
</html>
