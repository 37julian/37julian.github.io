<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julian's Aktivitäten</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ── Hero ──────────────────────────────────────────────────── -->
  <header class="hero">
    <div class="container">
      <h1 class="hero-title">Julian's Aktivitäten</h1>
      <p class="hero-sub">Automatisch von Garmin Connect • julianelsner.me</p>
      <div class="stats-grid" id="stats-cards">
        <div class="stat-card" style="grid-column:1/-1">
          <span style="color:rgba(255,255,255,.55)">Lade Statistiken…</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ── Main ──────────────────────────────────────────────────── -->
  <main class="container">

    <!-- Wöchentliche Distanz -->
    <section>
      <h2 class="section-title">Wöchentliche Distanz (letzte 16 Wochen)</h2>
      <div class="chart-card">
        <canvas id="weeklyChart"></canvas>
      </div>
    </section>

    <!-- Pace-Entwicklung -->
    <section>
      <h2 class="section-title">Pace-Entwicklung (letzte 60 Läufe)</h2>
      <div class="chart-card">
        <canvas id="paceChart"></canvas>
      </div>
    </section>

    <!-- Herzfrequenz-Entwicklung -->
    <section>
      <h2 class="section-title">Herzfrequenz-Entwicklung (letzte 60 Läufe)</h2>
      <div class="chart-card">
        <canvas id="hrChart"></canvas>
      </div>
    </section>

    <!-- Letzte Aktivitäten -->
    <section>
      <h2 class="section-title">Letzte Aktivitäten</h2>
      <div id="activities-list">
        <div class="empty">Lade Aktivitäten…</div>
      </div>
    </section>

  </main>

  <!-- ── Footer ────────────────────────────────────────────────── -->
  <footer>
    <div class="container">
      <span id="last-updated"></span>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
