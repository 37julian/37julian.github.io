[project]
name = "garmin-coach"
version = "0.1.0"
description = "Lokale Garmin-Daten-Auswertung mit Claude-AI-Coach"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "garminconnect>=0.2.20",
  "garth>=0.4.46",
  "fitparse>=1.2",
  "anthropic>=0.39",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
